name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    name: Build control toolkit against paperboat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat
          ref: dev
          path: paperboat
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat-toolkit-optimization
          ref: dev
          path: optimization
      - name: Overlay the toolkits
        run: |
          cp -r optimization/engine/toolkit/optimization paperboat/engine/toolkit/optimization
          cp -r engine/toolkit/control paperboat/engine/toolkit/control
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake g++
      - name: Configure
        run: cmake -S paperboat/engine -B paperboat/engine/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPAPERBOAT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build paperboat/engine/build
      - name: Test
        run: ctest --test-dir paperboat/engine/build --output-on-failure

  validate:
    name: Validate toolkit files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check toolkit.toml parses
        run: python3 -c "import tomllib; tomllib.load(open('engine/toolkit/control/toolkit.toml','rb')); print('toolkit.toml OK')"
      - name: Check the public header is present
        run: test -f engine/toolkit/control/include/paperboat/toolkit/control.hpp && echo OK

  # The path a user takes (paperboatlab/paperboat#354): paperboat installed as a release (shared engine and
  # SDK), then `paperboat toolkit install` builds this toolkit as a plugin against it. No engine checkout.
  plugin:
    name: Install as a plugin on an installed paperboat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat
          ref: dev
          path: paperboat
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake g++ git 
      - name: paperboat, installed as a release would be
        run: |
          cmake -S paperboat/engine -B "$RUNNER_TEMP/pb-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DPAPERBOAT_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/pb-build"
          cmake --install "$RUNNER_TEMP/pb-build" --prefix "$RUNNER_TEMP/pb"
      - name: paperboat toolkit install control, from this checkout
        env:
          PAPERBOAT_HOME: ${{ runner.temp }}/home
        run: |
          cd "$RUNNER_TEMP"   # outside any checkout: the installed paperboat, as a user has it
          "$RUNNER_TEMP/pb/bin/paperboat" toolkit install control --path "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/pb/bin/paperboat" toolkit list control | grep -q "control/"
