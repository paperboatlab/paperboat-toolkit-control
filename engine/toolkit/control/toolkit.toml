# Optional control toolkit: the clock dynamics (pid, integrator, lag, delay) and per-step
# MPC, LP and NMPC blocks. Its CMake links the optimization toolkit's Workspace; the backend
# registers `control::register_control` when it links this package.
name = "control"
version = "0.1.1"
optional = true
register = ["register_control"]
# A Signal flow's clock, and a Step flow's signal blocks.
flows = ["signal", "step"]
